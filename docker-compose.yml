services:
  postgres:
    image: postgres:16-alpine
    container_name: tracedeck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracedeck
      POSTGRES_PASSWORD: tracedeck_password
      POSTGRES_DB: tracedeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracedeck -d tracedeck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracedeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tracedeck-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tracedeck:tracedeck_password@postgres:5432/tracedeck?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production-super-secret-jwt-key-tracedeck-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: tracedeck-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tracedeck:tracedeck_password@postgres:5432/tracedeck?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
